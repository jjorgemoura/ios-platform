name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        type: choice
        required: true
        options: [patch, minor, major]

# Two releases must never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Release only from main, and only if lint, tests, docs and demo all pass.
  ci:
    if: github.ref == 'refs/heads/main'
    uses: jjorgemoura/ios-platform/.github/workflows/ci.yml@v1
    with:
      module: __MODULE__

  release:
    needs: ci
    permissions:
      contents: write # create the tag and the GitHub Release
    uses: jjorgemoura/ios-platform/.github/workflows/release.yml@v1
    with:
      bump: ${{ inputs.bump }}
