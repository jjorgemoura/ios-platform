# Inventory of every repository in the project. Read by platform/scripts/sync.sh (status: active and sync: true)
# and platform/scripts/create-labels.sh (status: active).
# sync_exclude: template files or folders (relative to platform/templates/sync) the repo owns or that do not
# apply to it; sync.sh never writes them.
owner: jjorgemoura

repos:
  - name: gpx-swift
    visibility: public
    status: active         # planned | active | archived
    sync: true
  - name: fit-swift
    visibility: public
    status: active
    sync: true
  - name: map-swift
    visibility: public
    status: active
    sync: true
  - name: gps-swift
    visibility: public
    status: active
    sync: true
  - name: audio-swift
    visibility: public
    status: active
    sync: true
  - name: ultra-tools
    visibility: private
    status: active
    sync: true
    # The monorepo owns these: its Makefile loops over Packages/, its AGENTS.md is standalone
    # (local packages depend on each other, against API-1). The two skills are for libraries
    # (public API with SemVer, the library Release workflow). ADR-0016.
    sync_exclude: [AGENTS.md, Makefile, .gitignore, .github/dependabot.yml, .claude/skills/add-public-api, .claude/skills/create-release]
