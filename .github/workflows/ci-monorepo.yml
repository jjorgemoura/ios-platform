name: CI monorepo (reusable)

# Called by the private monorepo (CI-1). Lints, tests and builds every package under Packages/.
#
#   jobs:
#     ci:
#       uses: jjorgemoura/ios-platform/.github/workflows/ci-monorepo.yml@v1
#       with:
#         workspace: UltraTools.xcworkspace
#
# The repo must provide: a Makefile with `test` and `build` targets (`make build PLATFORM=...`),
# `.xcode-version`, `.swiftlint.yml` and the workspace.

on:
  workflow_call:
    inputs:
      workspace:
        description: Workspace that contains every package under Packages/.
        type: string
        required: true
      platforms:
        description: JSON array of platforms to build. Must match the platforms declared in every Package.swift.
        type: string
        default: '["iOS", "macOS", "watchOS", "visionOS"]'
      swiftlint-version:
        description: SwiftLint release to install on the lint job.
        type: string
        default: "0.65.1"
      runner:
        description: macOS runner label that has the pinned Xcode.
        type: string
        default: xcode-27

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Pinned to noble: the prebuilt SwiftLint binary needs libxml2.so.2.
    container: swift:noble
    env:
      SWIFTLINT_VERSION: ${{ inputs.swiftlint-version }}
    steps:
      - uses: actions/checkout@v7
      - name: swift-format
        run: swift format lint --strict --recursive Packages Apps
      - name: Install SwiftLint
        run: |
          apt-get update -qq && apt-get install -y -qq curl unzip libxml2 >/dev/null
          arch=$(uname -m | sed 's/x86_64/amd64/')
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_${arch}.zip"
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: SwiftLint
        run: swiftlint --strict Packages Apps

  # One build per platform; each builds every package. Tests run once on macOS below.
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jjorgemoura/ios-platform/.github/actions/select-xcode@v1
      - name: Build packages for ${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            iOS | macOS | watchOS | tvOS | visionOS) ;;
            *) echo "::error::Unknown platform '$PLATFORM'"; exit 1 ;;
          esac
          make build PLATFORM="$PLATFORM"

  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jjorgemoura/ios-platform/.github/actions/select-xcode@v1
      - run: make test
