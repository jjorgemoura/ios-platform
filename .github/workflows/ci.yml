name: CI (reusable)

# Called by every library repo (CI-1). A library passes only its module name and,
# when it differs from the defaults, the platforms and optional jobs it has.
#
#   jobs:
#     ci:
#       uses: jjorgemoura/ios-platform/.github/workflows/ci.yml@v1
#       with:
#         module: GPXSwift
#
# The library repo must provide: a Makefile with `test` and `docs` targets,
# `.xcode-version`, `.swiftlint.yml` and, when `demo` is true, the demo workspace.

on:
  workflow_call:
    inputs:
      module:
        description: SwiftPM library product, also the scheme used to build every platform (for example GPXSwift).
        type: string
        required: true
      platforms:
        description: JSON array of platforms to build (PLAT-3). Must match the platforms declared in Package.swift (PLAT-2).
        type: string
        default: '["iOS", "macOS", "watchOS", "tvOS", "visionOS"]'
      linux:
        description: Also build and test on Linux (PLAT-4). Set false for libraries that import Apple-only frameworks.
        type: boolean
        default: true
      demo:
        description: Build the demo app.
        type: boolean
        default: true
      demo-workspace:
        description: Workspace holding the library and the demo project. Defaults to <module>.xcworkspace.
        type: string
        default: ""
      demo-scheme:
        description: Demo app scheme.
        type: string
        default: DemoApp
      swiftlint-version:
        description: SwiftLint release to install on the lint job.
        type: string
        default: "0.65.1"
      runner:
        description: macOS runner label that has the pinned Xcode.
        type: string
        default: xcode-27

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Pinned to noble: the prebuilt SwiftLint binary needs libxml2.so.2, which
    # newer distros behind swift:latest no longer package.
    container: swift:noble
    env:
      SWIFTLINT_VERSION: ${{ inputs.swiftlint-version }}
    steps:
      - uses: actions/checkout@v7
      - name: swift-format
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Install SwiftLint
        run: |
          # libxml2 is a runtime dependency of the prebuilt SwiftLint binary.
          apt-get update -qq && apt-get install -y -qq curl unzip libxml2 >/dev/null
          arch=$(uname -m | sed 's/x86_64/amd64/')
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_${arch}.zip"
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: SwiftLint
        run: swiftlint --strict
      # Analyzer rules need a compiler log. Not --strict until the existing violations are cleaned up, so it only reports warnings for now.
      - name: SwiftLint analyze
        run: |
          swift build -v > build.log 2>&1 || { tail -20 build.log; exit 1; }
          swiftlint analyze --compiler-log-path build.log

  test-linux:
    if: inputs.linux
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v7
      - run: swift test -Xswiftc -warnings-as-errors

  # One build per declared platform (PLAT-3). Tests run once on macOS below.
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jjorgemoura/ios-platform/.github/actions/select-xcode@v1
      - name: Build ${{ inputs.module }} for ${{ matrix.platform }}
        env:
          MODULE: ${{ inputs.module }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            iOS | macOS | watchOS | tvOS | visionOS) ;;
            *) echo "::error::Unknown platform '$PLATFORM'"; exit 1 ;;
          esac
          xcodebuild build -scheme "$MODULE" \
            -destination "generic/platform=$PLATFORM" -quiet

  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jjorgemoura/ios-platform/.github/actions/select-xcode@v1
      - run: make test

  demo:
    if: inputs.demo
    name: demo (${{ matrix.name }})
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v7
      - uses: jjorgemoura/ios-platform/.github/actions/select-xcode@v1
      # Build through the workspace: the demo project only finds the package there.
      - name: Build demo app
        env:
          WORKSPACE: ${{ inputs.demo-workspace || format('{0}.xcworkspace', inputs.module) }}
          SCHEME: ${{ inputs.demo-scheme }}
          DESTINATION: ${{ matrix.destination }}
        run: |
          xcodebuild build -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -destination "$DESTINATION" CODE_SIGNING_ALLOWED=NO -quiet

  # Skipped on PRs. Runs on pushes to main and on release, so a broken DocC
  # build stops a release.
  docs:
    if: github.event_name != 'pull_request'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jjorgemoura/ios-platform/.github/actions/select-xcode@v1
      - run: make docs
