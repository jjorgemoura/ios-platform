name: CI (reusable)

# Called by every library repo (CI-1). A library passes only its module name and,
# when it differs from the defaults, the platforms and optional jobs it has.
#
#   jobs:
#     ci:
#       uses: jjorgemoura/ios-platform/.github/workflows/ci.yml@v1
#       with:
#         module: GPXSwift
#
# The library repo must provide: a Makefile with a `docs` target,
# `.xcode-version`, `.swiftlint.yml` and, when `demo` is true, the demo workspace.

on:
  workflow_call:
    inputs:
      module:
        description: SwiftPM library product, also the scheme used to build every platform (for example GPXSwift).
        type: string
        required: true
      platforms:
        description: JSON array of platforms to build (PLAT-3). Must match the platforms declared in Package.swift (PLAT-2).
        type: string
        default: '["iOS", "macOS", "watchOS", "tvOS", "visionOS"]'
      linux:
        description: Also build and test on Linux (PLAT-4). Set false for libraries that import Apple-only frameworks.
        type: boolean
        default: true
      demo:
        description: Build the demo app.
        type: boolean
        default: true
      demo-workspace:
        description: Workspace holding the library and the demo project. Defaults to <module>.xcworkspace.
        type: string
        default: ""
      demo-scheme:
        description: Demo app scheme.
        type: string
        default: DemoApp
      swiftlint-version:
        description: SwiftLint release to install on the lint job.
        type: string
        default: "0.65.1"
      runner:
        description: macOS runner label that has the pinned Xcode. The default is the GitHub-hosted Xcode 27 image (public preview); switch to macos-27 when it reaches GA.
        type: string
        default: xcode-27

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Swift 6.4 (TOOL-1) on noble: the prebuilt SwiftLint binary needs libxml2.so.2,
    # which newer distros no longer package.
    container: swift:6.4-noble
    env:
      SWIFTLINT_VERSION: ${{ inputs.swiftlint-version }}
    steps:
      - uses: actions/checkout@v7
      - name: swift-format
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Install SwiftLint
        run: |
          # libxml2 is a runtime dependency of the prebuilt SwiftLint binary.
          apt-get update -qq && apt-get install -y -qq curl unzip libxml2 >/dev/null
          arch=$(uname -m | sed 's/x86_64/amd64/')
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_${arch}.zip"
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: SwiftLint
        run: swiftlint --strict
      # Analyzer rules need a compiler log. Not --strict until the existing violations are cleaned up, so it only reports warnings for now.
      - name: SwiftLint analyze
        run: |
          swift build -v > build.log 2>&1 || { tail -20 build.log; exit 1; }
          swiftlint analyze --compiler-log-path build.log
      # ADR-0002 / API-1: a library never depends on another library in this set. Every
      # repo of the owner is in the set, so no resolved dependency may come from the owner.
      - name: Libraries are independent
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          [ -f Package.resolved ] || { echo "No dependencies."; exit 0; }
          if grep -iE "\"location\" *: *\"[^\"]*github\.com[/:]${OWNER}/" Package.resolved; then
            echo "::error::A library must not depend on another ${OWNER} repository (API-1, ADR-0002)."
            exit 1
          fi

  test-linux:
    if: inputs.linux
    runs-on: ubuntu-latest
    container: swift:6.4-noble # same Swift as the pinned Xcode (TOOL-1)
    steps:
      - uses: actions/checkout@v7
      - run: swift test -Xswiftc -warnings-as-errors

  # One build per declared platform (PLAT-3). Tests run once on macOS below.
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jjorgemoura/ios-platform/.github/actions/select-xcode@v1
      - name: Build ${{ inputs.module }} for ${{ matrix.platform }}
        env:
          MODULE: ${{ inputs.module }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            iOS | macOS | watchOS | tvOS | visionOS) ;;
            *) echo "::error::Unknown platform '$PLATFORM'"; exit 1 ;;
          esac
          xcodebuild build -scheme "$MODULE" \
            -destination "generic/platform=$PLATFORM" -quiet

  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jjorgemoura/ios-platform/.github/actions/select-xcode@v1
      # Same flags as `make test`, plus coverage (ADR-0009). Coverage is reported, not gated.
      - name: Test
        run: swift test --enable-code-coverage -Xswiftc -warnings-as-errors
      - name: Coverage report
        run: |
          echo '### Coverage (sources, line coverage)' >> "$GITHUB_STEP_SUMMARY"
          python3 - "$(swift test --show-codecov-path)" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          files = [f for f in json.load(open(sys.argv[1]))["data"][0]["files"]
                   if "/.build/" not in f["filename"] and "/Tests/" not in f["filename"]]
          root = os.getcwd() + "/"
          covered = sum(f["summary"]["lines"]["covered"] for f in files)
          total = sum(f["summary"]["lines"]["count"] for f in files)
          print("| File | Lines | Covered |\n| --- | ---: | ---: |")
          for f in sorted(files, key=lambda f: f["filename"]):
              s = f["summary"]["lines"]
              print(f"| `{f['filename'].replace(root, '')}` | {s['count']} | {s['percent']:.1f}% |")
          percent = 100 * covered / max(total, 1)
          print(f"| **Total** | {total} | {percent:.1f}% |")
          open(os.environ["RUNNER_TEMP"] + "/coverage", "w").write(f"{percent:.1f}")
          PY
          # TEST-6: SHOULD reach 85%. A warning, not a failure.
          awk -v p="$(cat "$RUNNER_TEMP/coverage")" 'BEGIN { if (p < 85) printf "::warning::Line coverage %s%% is below 85%% (TEST-6).\n", p }'

  demo:
    if: inputs.demo
    name: demo (${{ matrix.name }})
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v7
      - uses: jjorgemoura/ios-platform/.github/actions/select-xcode@v1
      # Build through the workspace: the demo project only finds the package there.
      - name: Build demo app
        env:
          WORKSPACE: ${{ inputs.demo-workspace || format('{0}.xcworkspace', inputs.module) }}
          SCHEME: ${{ inputs.demo-scheme }}
          DESTINATION: ${{ matrix.destination }}
        run: |
          xcodebuild build -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -destination "$DESTINATION" CODE_SIGNING_ALLOWED=NO -quiet

  # Skipped on PRs. Runs on pushes to main and on release, so a broken DocC
  # build stops a release.
  docs:
    if: github.event_name != 'pull_request'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jjorgemoura/ios-platform/.github/actions/select-xcode@v1
      - run: make docs
