name: Select Xcode
description: Select the Xcode version pinned in the calling repository's .xcode-version (TOOL-3).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        version=$(tr -d '[:space:]' < .xcode-version)
        app="/Applications/Xcode_${version}.app"
        if [ ! -d "$app" ]; then
          echo "::error::Xcode ${version} (.xcode-version) is not installed on this runner."
          ls -d /Applications/Xcode_*.app
          exit 1
        fi
        sudo xcode-select -s "$app"
        xcodebuild -version
